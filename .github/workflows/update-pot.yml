name: Update .pot file 🌐

on:
  pull_request:
    branches: [dev]
    paths:
      - "**.php"
      - "**.js"
  workflow_dispatch:

jobs:
  update-pot-file:
    uses: pressbooks/reusable-workflows/.github/workflows/update-pot.yml@main
    secrets: inherit
    with:
      domain: "pressbooks-saml-sso"
      slug: "pressbooks-saml-sso"
      package_name: "Pressbooks SAML SSO"
      headers: '{"Report-Msgid-Bugs-To": "https://github.com/pressbooks/pressbooks-saml-sso/issues"}'
